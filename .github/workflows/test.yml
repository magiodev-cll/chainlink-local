name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'devrel-205/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.8.3
  NODE_VERSION: '22'

jobs:
  foundry:
    name: Foundry (build, fmt, non-fork tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: forge build
        run: forge build

      - name: forge fmt --check
        run: forge fmt --check

      - name: forge test (non-fork)
        run: forge test --no-match-path 'test/e2e/**'

  hardhat:
    name: Hardhat (Solidity + JS unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Hardhat Solidity tests (unit + smoke only)
        run: npx hardhat test solidity $(ls test/unit/*/*.t.sol test/smoke/*/*.t.sol)

      - name: JS unit tests
        run: npm run js-unit-test

      - name: Data Streams JS smoke tests
        run: node --test test/smoke/data-streams/*.test.js

  consumer-smoke:
    name: Consumer smoke (npm tarball)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Run consumer smoke script
        run: bash .github/scripts/consumer-smoke.sh

  fork:
    name: Fork tests (manual, needs RPC secrets)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ETHEREUM_SEPOLIA_RPC_URL: ${{ secrets.ETHEREUM_SEPOLIA_RPC_URL }}
      ARBITRUM_SEPOLIA_RPC_URL: ${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}
      AVALANCHE_FUJI_RPC_URL: ${{ secrets.AVALANCHE_FUJI_RPC_URL }}
      BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
      ETHEREUM_MAINNET_RPC_URL: ${{ secrets.ETHEREUM_MAINNET_RPC_URL }}
      ARBITRUM_MAINNET_RPC_URL: ${{ secrets.ARBITRUM_MAINNET_RPC_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm ci
        run: npm ci

      - name: forge test (fork suites, serial)
        run: forge test -j 1 --match-path 'test/e2e/**'

      - name: Hardhat JS fork tests
        run: npm run hardhat-test-js

  canton:
    name: Canton (unit + sandbox smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DPM_VERSION: '1.1.3'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dpm
        run: |
          mkdir -p "$HOME/.local/bin"
          base="https://github.com/digital-asset/dpm/releases/download/${DPM_VERSION}"
          curl -sSL -o dpm.tar.gz "${base}/dpm-${DPM_VERSION}-linux-amd64.tar.gz"
          curl -sSL -o checksums.txt "${base}/dpm-${DPM_VERSION}-checksums.txt"
          grep linux-amd64 checksums.txt | sha256sum -c -
          tar xzf dpm.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/dpm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.dpm/bin" >> "$GITHUB_PATH"

      - name: Install the Daml SDK
        run: dpm install 3.4.11

      - name: npm ci
        run: npm ci

      - name: Canton tests
        run: npm run test:canton
